[project]
name = "manual-tracers"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "clickhouse-connect>=1.6.0",
    "fastapi>=0.139.2",
    "langchain-google-genai>=4.3.2",
    "langfuse>=4.14.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["RCA/tests"]
